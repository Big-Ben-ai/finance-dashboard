<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --sheet:#FFFFFF; --ink:#152033; --ink-2:#5A6577; --ink-3:#94A0B2; --line:#E2E7EE;
  --crypto:#169E7A; --uah:#E3A21A; --cash:#6B5CE7; --ewallet:#2F7DE1; --bank:#7C8AA0;
  --out:#D6453D; --in:#169E7A; --focus:#2F7DE1;
}
[data-theme="dark"]{
  --bg:#151B26; --sheet:#1D2533; --ink:#E9EDF3; --ink-2:#A3ADBD; --ink-3:#6E7A8D; --line:#2A3343;
  --crypto:#2BB991; --uah:#F0B43A; --cash:#8B7EF2; --ewallet:#4B95F0; --bank:#8E9BB0;
  --out:#F0685F; --in:#2BB991;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;color:var(--ink-2);font-size:13px}
.top button{padding:6px 10px;border-radius:999px;background:var(--sheet);color:var(--ink-2)}

/* hero */
.hero{margin:6px 0 14px;padding:22px 20px 20px;border-radius:26px;color:#EAF0F8;
  background:radial-gradient(120% 90% at 100% 0%,rgba(47,125,225,.38),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(22,158,122,.28),transparent 60%),linear-gradient(160deg,#17263F,#0C1523)}
[data-theme="dark"] .hero{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hero .cap{font-size:13px;color:rgba(234,240,248,.62)}
.total{font-weight:300;font-size:50px;letter-spacing:-.025em;line-height:1.05;margin-top:4px}
.total .cur{font-size:26px;color:rgba(234,240,248,.6);margin-left:4px}
.sub{color:rgba(234,240,248,.62);margin-top:6px;font-size:14px}
.ribbon{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:22px 0 16px;background:rgba(255,255,255,.12);gap:2px}
.hero .legend small{color:rgba(234,240,248,.62)}
.hero .legend b{color:#fff}
.hero .legend b span{color:rgba(234,240,248,.5)!important}
.ribbon span{display:block;height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.ribbon span{animation:none}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.legend div{display:flex;flex-direction:column}
.legend b{font-weight:500;font-size:15px}
.legend small{color:var(--ink-2);font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.seg{display:flex;background:var(--sheet);border-radius:12px;padding:4px}
.seg button{flex:1;padding:8px 0;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* sheet */
.sheet{background:var(--sheet);border-radius:20px;padding:6px 16px;margin-bottom:12px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-weight:500}
.ghead span:first-child{display:flex;align-items:center;gap:8px}
.ghead span:last-child{color:var(--ink-2);font-weight:400}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--ink-2);font-size:13px}
.row .r{text-align:right;flex:none}
.out{color:var(--out)} .in{color:var(--in)}

/* spending */
.month{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.month button{width:36px;height:36px;border-radius:50%;background:var(--sheet);font-size:18px;color:var(--ink-2)}
.month button:disabled{opacity:.35}
.month h2{font-weight:500;font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0 6px}
.kpis div{display:flex;flex-direction:column}
.kpis small{color:var(--ink-2);font-size:13px}
.kpis b{font-weight:500;font-size:19px}
.note{color:var(--ink-2);font-size:14px;padding:4px 0 12px}
.cat{padding:10px 0}
.cat + .cat{border-top:1px solid var(--line)}
.cat .t{display:flex;justify-content:space-between;gap:10px}
.cat .t span:last-child{color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink)}
.trend{padding-top:6px;padding-bottom:8px}
.trend h3,.sheet h3{font-weight:500;font-size:15px;padding:12px 0 4px}
.trend svg{width:100%;height:150px;display:block}
.trend text{fill:var(--ink-3);font-size:11px;font-family:inherit}
.keys{display:flex;gap:14px;color:var(--ink-2);font-size:13px;padding:2px 0 12px}
.keys span{display:flex;align-items:center;gap:6px}

/* ops */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{padding:7px 12px;border-radius:999px;background:var(--sheet);color:var(--ink-2);font-size:14px;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{color:var(--ink-2);font-size:13px;padding:14px 0 2px}

.empty{padding:28px 4px;color:var(--ink-2);text-align:center}
.alert{background:color-mix(in srgb,var(--out) 12%,var(--sheet));color:var(--ink);border-radius:14px;padding:12px 14px;margin:4px 0 12px;font-size:14px}
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left}
.gate h1{font-weight:400;font-size:28px}
.gate p{color:var(--ink-2)}
.gate button{align-self:flex-start;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500}

/* groups */
.grp{background:var(--sheet);border-radius:20px;margin-bottom:10px;overflow:hidden}
.gh{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600;font-size:17px}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b,.gs b{font-weight:500;font-size:16px}
.gt small,.gs small{color:var(--ink-2);font-size:13px}
.gs{display:flex;flex-direction:column;align-items:flex-end}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
[data-open="true"]>.gh .chev,[data-open="true"]>.ar .chev{transform:rotate(180deg)}
.gbody,.abody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
[data-open="true"]>.gbody,[data-open="true"]>.abody{grid-template-rows:1fr}
.ginner,.ainner{overflow:hidden;min-height:0}
@media (prefers-reduced-motion:reduce){.gbody,.abody,.chev{transition:none}}
.acc{border-top:1px solid var(--line);margin:0 16px}
.ar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;text-align:left}
.ar .l{flex:1;min-width:0}
.ar .meta{color:var(--ink-2);font-size:13px}
.ar .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .r{display:flex;align-items:center;gap:8px;font-weight:500}
.ar .chev{width:16px;height:16px}
.aitems{padding:0 0 8px 12px;border-left:2px solid var(--line);margin:0 0 6px 2px}
.ai{display:flex;justify-content:space-between;gap:12px;padding:6px 0 6px 12px;font-size:14px}
.ai .meta{color:var(--ink-2);font-size:13px}
.ai .r{text-align:right}
.ai.np{opacity:.6}

/* ops icons */
.op{display:flex;align-items:center;gap:12px}
.ic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;font-weight:600;
  background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.ic.expense,.ic.fee{--k:var(--out)} .ic.income{--k:var(--in)} .ic.transfer,.ic.exchange{--k:var(--ewallet)} .ic.adjustment{--k:var(--ink-3)}
.op .l{flex:1}

/* ---- v3 ---- */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{border-radius:18px;padding:14px 14px 13px;background:var(--sheet);text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile small{color:var(--ink-2);font-size:13px}
.tile b{font-weight:500;font-size:20px}
.tile em{font-style:normal;color:var(--ink-2);font-size:13px}
.tile.t1{background:linear-gradient(150deg,color-mix(in srgb,var(--out) 13%,var(--sheet)),var(--sheet) 70%)}
.tile.t2{background:linear-gradient(150deg,color-mix(in srgb,var(--cash) 14%,var(--sheet)),var(--sheet) 70%)}
.tile.ok{background:linear-gradient(150deg,color-mix(in srgb,var(--in) 14%,var(--sheet)),var(--sheet) 70%)}
.tile .mini{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.tile .mini i{display:block;height:100%;border-radius:3px}
.alert.warn{background:color-mix(in srgb,var(--uah) 16%,var(--sheet))}
.alert.info{background:color-mix(in srgb,var(--ewallet) 13%,var(--sheet));cursor:pointer;width:100%;text-align:left;display:block}
.chart{padding:14px 16px 10px;margin-bottom:12px}
.chart .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chart .hd b{font-weight:500;font-size:22px;display:block}
.chart .hd small{color:var(--ink-2);font-size:13px}
.rng{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.rng button{padding:5px 10px;border-radius:8px;font-size:13px;color:var(--ink-2)}
.rng button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart svg{width:100%;height:130px;display:block;margin-top:8px;touch-action:pan-y}
.chart .hint{color:var(--ink-3);font-size:12.5px;padding:2px 0 4px}
.delta{font-size:13px;font-weight:500}
.cat{cursor:default}
.cat .t span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.cat .t span:last-child{white-space:nowrap}
.cat .lim{font-size:12.5px;color:var(--ink-2);padding-top:4px;display:flex;justify-content:space-between}
.cat .lim.over{color:var(--out)}
.linkbtn{color:var(--ewallet);font-size:14px;padding:6px 0}
.head2{display:flex;justify-content:space-between;align-items:center}
.head2 span{display:flex;gap:14px}
.small{border-top:1px dashed var(--line);margin-top:2px}
.small .ar{padding:8px 0 8px 12px;font-size:14px;color:var(--ink-2)}
.op{cursor:pointer;width:100%;text-align:left}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--uah) 22%,transparent);color:var(--ink);margin-left:6px;vertical-align:1px}

/* sheet overlay */
.ov{position:fixed;inset:0;background:rgba(8,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.pan{background:var(--sheet);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.pan .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.pan h2{font-weight:500;font-size:19px}
.pan .sub2{color:var(--ink-2);font-size:14px;margin:2px 0 14px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.opts button{padding:9px 14px;border-radius:12px;background:var(--bg);color:var(--ink);font-size:14.5px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lbl{color:var(--ink-2);font-size:13px;margin:4px 0 6px}
.pan select,.pan input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.save{width:100%;margin-top:16px;padding:13px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:500}
.save:disabled{opacity:.5}
.lim-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.lim-row span{flex:1}
.lim-row input{width:110px;text-align:right}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ov,.pan{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30}
.grp{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 9%,var(--sheet)),var(--sheet) 90px)}


.cat{display:block;width:100%;text-align:left}
.cat .chev.r90{width:14px;height:14px;margin-left:6px;vertical-align:-2px;transform:none}
.rangebox{display:flex;align-items:center;gap:10px;padding:8px 0 12px;color:var(--ink-2)}
.rangebox input{flex:1;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.pan textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;resize:vertical}
.lim-row input.wide{width:100%;text-align:left}
.pan .row.op{padding:11px 0}

.swipe{position:relative;overflow:hidden}
.swdel{position:absolute;right:0;top:0;bottom:0;width:92px;background:var(--out);color:#fff;font:inherit;font-weight:600;border:0}
.swipe>.row{position:relative;background:var(--sheet);transition:transform .22s ease;width:100%;text-align:left}
.swipe.open>.row{transform:translateX(-92px)}
.kpis .ut{display:block;margin-top:2px;color:var(--ink-3)}

.searchbox{margin:0 0 10px}
.searchbox input{width:100%;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.searchbox input::placeholder{color:var(--ink-3)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="empty">Загружаю…</div></main>

<script>
const API = "https://cohqvftovjqufdxpedpo.supabase.co/functions/v1/api";
const tg = window.Telegram && window.Telegram.WebApp;
const GROUPS = [
  {name:"Крипта", v:"--crypto"}, {name:"Гривна", v:"--uah"}, {name:"Наличка", v:"--cash"},
  {name:"Электронные кошельки", v:"--ewallet"}, {name:"Банки", v:"--bank"}
];
const CRYPTO = ["USDT","BTC","ETH","SOL","TRX"];
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MSHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (n, d = 0) => new Intl.NumberFormat("ru-RU", {maximumFractionDigits:d, minimumFractionDigits:0}).format(n);
const dec = a => CRYPTO.includes(a) && a !== "USDT" ? 6 : 2;
const eur = n => nf(Math.round(n)) + " €";
const ym = d => d.slice(0, 7);
const state = {data:null, tab:"accounts", month:null, filter:"all"};

function theme(){
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (tg && tg.setHeaderColor) try { tg.setHeaderColor(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); tg.setBackgroundColor(getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); } catch(e){}
}
const color = g => "var(" + (GROUPS.find(x => x.name === g) || GROUPS[4]).v + ")";
const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} };

async function load(){
  const q = new URLSearchParams(location.search);
  if (q.has("demo")) { state.data = demo(); return render(); }
  if (!tg || !tg.initData) { return gate(); }
  try {
    const r = await fetch(API, {headers:{"x-init-data": tg.initData}});
    if (r.status === 403) return gate("Нет доступа. Дашборд открывается только у владельца бота.");
    if (!r.ok) throw new Error("Сервер ответил " + r.status);
    state.data = await r.json();
    render();
  } catch (e) {
    $("#app").innerHTML = '<div class="gate"><h1>Данные не загрузились</h1><p>' + esc(e.message) + '. Проверь интернет и попробуй ещё раз.</p><button onclick="load()">Обновить</button></div>';
  }
}
function gate(msg){
  $("#app").innerHTML = '<div class="gate"><h1>Финансы</h1><p>' + esc(msg || "Открой дашборд из бота: кнопка «Дашборд» в меню чата.") + '</p><button onclick="location.search=\'?demo=1\'">Посмотреть на примере</button></div>';
}

const flowCats = f => (state.data.cats || []).filter(c => c.flow === f);
const thisMonth = () => new Date().toISOString().slice(0,7);
function spentByCat(m){
  const by = {};
  state.data.ops.filter(o => ym(o.d) === m && isSpend(o)).forEach(o => { const k = o.catId || "_"; by[k] = (by[k]||0) - o.eur; });
  return by;
}
function budgetState(){
  const d = state.data, lim = {}; (d.budgets || []).forEach(b => lim[b.category_id] = Number(b.monthly_eur));
  const by = spentByCat(thisMonth()), over = [], near = [];
  Object.entries(lim).forEach(([id, l]) => {
    const sp = by[id] || 0, nm = ((d.cats||[]).find(c => c.id === id)||{}).name || "Категория";
    if (sp > l) over.push({nm, pc: Math.round(sp/l*100)}); else if (sp > l*.8) near.push({nm, pc: Math.round(sp/l*100)});
  });
  return {lim, by, over, near, count: Object.keys(lim).length};
}
const toReview = () => state.data.ops.filter(o => o.status === "needs_review" && o.kind !== "adjustment");

function render(){
  const d = state.data;
  d.holdings.forEach(h => { h.group = grp(h); });
  const months = [...new Set(d.ops.map(o => ym(o.d)))].sort();
  const cur = thisMonth();
  if (!months.includes(cur)) months.push(cur);
  state.months = months;
  if (!state.month) state.month = cur;
  const total = d.holdings.reduce((s,h) => s + h.eur, 0);
  const usd = d.rates.USD ? total / d.rates.USD : null;
  const groups = GROUPS.map(g => ({...g, eur: d.holdings.filter(h => h.group === g.name).reduce((s,h)=>s+h.eur,0)})).filter(g => g.eur > 0.5);
  const synced = d.last_sync ? new Date(d.last_sync).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "ещё не было";
  const bs = budgetState(), rv = toReview();
  if (state.filter === "review" && !rv.length) state.filter = "all";
  const mo = d.ops.filter(o => ym(o.d) === cur), spent = mo.filter(isSpend).reduce((s,o)=>s-o.eur,0);
  const day = new Date().getDate();
  const warn = [
    ...bs.over.map(x => `<div class="alert" role="status">Лимит превышен: «${esc(x.nm)}», ${x.pc}%</div>`),
    ...bs.near.map(x => `<div class="alert warn" role="status">Лимит почти исчерпан: «${esc(x.nm)}», ${x.pc}%</div>`),
    ...(d.alerts||[]).slice(0,2).map(a => `<div class="alert" role="status">${esc(a.message)}</div>`),
    rv.length ? `<button class="alert info" onclick="reviewNow()">Нужно разобрать операций: ${rv.length}. Нажми, чтобы указать тип.</button>` : ""
  ].join("");
  const budgetTile = bs.count

/* ---------- net worth chart ---------- */
function chartCard(){
  const h = (state.data.history || []).map(p => ({t: new Date(p.ts).getTime(), v: Number(p.total_eur)}));
  const rng = state.range || "month";
  const span = rng === "week" ? 7 : rng === "month" ? 30 : 3650;
  const from = Date.now() - span * 864e5;
  let pts = h.filter(p => p.t >= from);
  if (pts.length > 120) { const k = Math.ceil(pts.length/120); pts = pts.filter((_,i) => i % k === 0 || i === pts.length-1); }
  const btn = (k,t) => `<button aria-pressed="${rng===k}" onclick="setRange('${k}')">${t}</button>`;
  const head = pts.length ? pts[pts.length-1].v : 0;
  const diff = pts.length > 1 ? head - pts[0].v : 0, pc = pts.length > 1 && pts[0].v ? diff / pts[0].v * 100 : 0;
  state.pts = pts;
  const since = h.length ? new Date(h[0].t).toLocaleDateString("ru-RU",{day:"numeric",month:"long"}) : "";
  return `<div class="sheet chart">
    <div class="hd"><div><small>Капитал</small><b id="cv">${eur(head)}</b><span class="delta ${diff>=0?"in":"out"}" id="cd">${pts.length>1 ? (diff>=0?"+":"−") + eur(Math.abs(diff)) + " (" + (diff>=0?"+":"−") + Math.abs(pc).toFixed(1) + "%)" : ""}</span></div>
      <div class="rng">${btn("week","Неделя")}${btn("month","Месяц")}${btn("all","Всё")}</div></div>
    ${pts.length > 1 ? chartSvg(pts) : '<div class="empty" style="padding:22px 0 10px">Точки появятся после нескольких обновлений. График собирается каждые 3 часа.</div>'}
    ${since ? `<div class="hint">История ведётся с ${since}. Старее данных нет.</div>` : ""}
  </div>`;
}
function setRange(k){ state.range = k; haptic(); pane(); }
function chartSvg(pts){
  const W = 520, H = 130, pt = 10, pb = 18;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t || t0 + 1;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < hi * .004) { lo -= hi * .01; hi += hi * .01; }
  const x = t => (t - t0) / ((t1 - t0) || 1) * W, y = v => H - pb - (v - lo) / (hi - lo) * (H - pb - pt);
  const line = pts.map((p,i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const area = line + " L" + W + " " + (H-pb) + " L0 " + (H-pb) + " Z";
  const fmt = t => new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  return `<svg id="csvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Капитал по времени">
    <defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--ewallet)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ewallet)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#gA)"/><path d="${line}" fill="none" stroke="var(--ewallet)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <line id="cl" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ink-3)" stroke-dasharray="3 3" style="display:none"/>
    <circle id="cc" r="4.5" fill="var(--sheet)" stroke="var(--ewallet)" stroke-width="2" cx="${x(t1)}" cy="${y(pts[pts.length-1].v)}" vector-effect="non-scaling-stroke"/>
    <text x="0" y="${H-3}" style="fill:var(--ink-3);font-size:11px">${fmt(t0)}</text>
    <text x="${W}" y="${H-3}" text-anchor="end" style="fill:var(--ink-3);font-size:11px">${fmt(t1)}</text>
  </svg>`;
}
function bindChart(){
  const svg = $("#csvg"); if (!svg || !state.pts) return;
  const pts = state.pts, W = 520, H = 130, pt = 10, pb = 18;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < hi * .004) { lo -= hi * .01; hi += hi * .01; }
  const y = v => H - pb - (v - lo) / (hi - lo) * (H - pb - pt);
  const move = e => {
    const r = svg.getBoundingClientRect(), fx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), t = t0 + fx * (t1 - t0);
    let best = pts[0]; pts.forEach(p => { if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p; });
    const cx = (best.t - t0) / ((t1 - t0) || 1) * W;
    $("#cl").style.display = ""; $("#cl").setAttribute("x1", cx); $("#cl").setAttribute("x2", cx);
    $("#cc").setAttribute("cx", cx); $("#cc").setAttribute("cy", y(best.v));
    $("#cv").textContent = eur(best.v);
    $("#cd").textContent = new Date(best.t).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    $("#cd").className = "delta"; $("#cd").style.color = "var(--ink-2)";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => pane());
}

    const accs = [...new Set(hs.map(h => h.account))].map(name => {

    }).sort((a,b) => b.eur - a.eur);
